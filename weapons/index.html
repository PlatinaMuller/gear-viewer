<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>武器ビューア / Weapon Viewer</title>
<style>
  /* =========================================================
     ★ よく変える設定はここ ★
     --columns      : 一覧の列の数
     --card-width   : 一覧のカードの横幅（高さは自動）
     --preview-width: 右側に出す拡大表示の横幅
     ========================================================= */
  :root {
    --columns: 3;
    --card-width: 220px;
    --preview-width: 660px;
    --accent: #e6c35c;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: #1b1d1f;
    color: #ddd;
    font-family: "Segoe UI", "Yu Gothic UI", sans-serif;
    padding: 32px 24px 90px;   /* 下はサイズバーの分だけ空ける */
    box-sizing: border-box;
  }
  .sub { color: #777; font-size: .85em; font-weight: normal; }

  .layout { display: flex; align-items: flex-start; justify-content: center; gap: 24px; }

  h1 { font-size: 16px; font-weight: 600; letter-spacing: .05em; margin: 0 0 14px; color: #bbb; }

  /* 表示の切り替え（種類別／弾丸別） */
  .modes { display: flex; gap: 6px; margin-bottom: 10px; }
  .modes button, .chips button {
    font: inherit; color: #bbb; background: #2a2d30; border: 1px solid #444;
    border-radius: 999px; padding: 5px 14px; cursor: pointer; font-size: 13px;
  }
  .modes button.on { color: #111; background: var(--accent); border-color: var(--accent); font-weight: 600; }

  /* 絞り込みボタン */
  .chips {
    display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px;
    max-width: calc((var(--card-width) + 10px) * var(--columns));
  }
  .chips button { font-size: 12px; padding: 4px 11px; }
  .chips button.on { color: var(--accent); border-color: var(--accent); }
  .chips .n { color: #777; margin-left: 4px; }

  /* 並べ替え */
  .sortbox { margin-bottom: 14px; font-size: 13px; color: #bbb; max-width: calc((var(--card-width) + 10px) * var(--columns)); }
  .sorthead { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .sortrow { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
  .sortrow .pri { width: 64px; color: #888; font-size: 12px; }
  .sortrow.off .pri { color: #555; }
  .sortbox select, .sortbox button {
    font: inherit; font-size: 12.5px; color: #ddd; background: #2a2d30; border: 1px solid #444;
    border-radius: 6px; padding: 4px 8px; cursor: pointer;
  }
  .sortbox select { flex: 1; }
  .sortbox select:disabled, .sortbox button:disabled { opacity: .4; cursor: default; }
  .sortbox select:focus { outline: 1px solid var(--accent); }
  .sortbox label { display: flex; align-items: center; gap: 5px; cursor: pointer; font-size: 12.5px; }
  .cell { position: relative; }
  .cell .val {
    position: absolute; top: 4px; right: 4px; padding: 1px 7px; border-radius: 999px; pointer-events: none;
    background: rgba(0,0,0,.75); border: 1px solid var(--accent); color: var(--accent);
    font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums;
  }
  .cell .val small { color: #aaa; font-weight: normal; font-size: 11px; }
  .cell .val small::before { content: ' / '; color: #666; }
  .cell .rank {
    position: absolute; bottom: 4px; left: 4px; padding: 0 6px; border-radius: 4px; pointer-events: none;
    background: rgba(0,0,0,.75); color: #aaa; font-size: 11px;
  }
  .group-title {
    margin: 18px 0 8px; font-size: 13px; color: var(--accent);
    border-bottom: 1px solid #333; padding-bottom: 4px;
  }
  .group-title:first-child { margin-top: 0; }

  .grid {
    display: grid;
    grid-template-columns: repeat(var(--columns), var(--card-width));
    gap: 10px;
  }
  .grid img {
    display: block;
    width: var(--card-width);
    border: 1px solid transparent;
    border-radius: 3px;
    cursor: pointer;
    transition: border-color .15s, transform .15s;
  }
  .grid img:hover { border-color: var(--accent); transform: translateY(-2px); }
  /* クリックで固定中のカード */
  .grid img.pinned { border: 2px solid var(--accent); box-shadow: 0 0 0 3px rgba(230,195,92,.25); }
  .pin-badge {
    display: none; margin-left: 8px; padding: 1px 10px; border-radius: 999px; font-size: 12px;
    background: var(--accent); color: #111; font-weight: 600; vertical-align: middle;
  }
  .preview.pinned .pin-badge { display: inline-block; }
  .hint { margin-top: 6px; color: #666; font-size: 12px; }

  /* 右側の表示エリア（スクロールしても画面上部に付いてくる） */
  .preview {
    position: sticky;
    top: 20px;
    width: var(--preview-width);
    max-width: calc(100vw - (var(--card-width) + 10px) * var(--columns) - 80px);
    max-height: calc(100vh - 40px);   /* 画面より長いときは右側だけスクロール */
    overflow-y: auto;
    padding: 0 6px 80px 0;            /* 下はサイズバーに隠れない分 */
    box-sizing: border-box;
    scrollbar-width: thin;
  }
  .preview .empty {
    border: 1px dashed #444; border-radius: 6px; aspect-ratio: 443 / 143;
    display: flex; align-items: center; justify-content: center; text-align: center;
    color: #666; font-size: 14px; line-height: 1.8;
  }
  .preview .detail { display: none; }
  .preview.show .empty { display: none; }
  .preview.show .detail { display: block; }
  .preview .detail > img { width: 100%; border-radius: 6px; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
  .info { margin-top: 14px; font-size: 14px; line-height: 1.9; }
  .info b { color: #fff; font-size: 18px; }
  .info .tag {
    display: inline-block; margin-right: 6px; padding: 1px 10px; border-radius: 999px;
    border: 1px solid #555; font-size: 12px; color: #ccc;
  }
  .info .cal { border-color: var(--accent); color: var(--accent); }
  .same { margin-top: 14px; color: #999; font-size: 13px; }
  .same span { color: #ddd; }
  /* 同じ弾を使う銃の写真 */
  .same-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px;
  }
  .same-grid img {
    width: 100%; display: block; border: 1px solid transparent; border-radius: 3px; cursor: pointer;
    transition: border-color .15s;
  }
  .same-grid img:hover { border-color: var(--accent); }
  /* ステータス表 */
  .stats { margin-top: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 22px; }
  .stat { font-size: 12.5px; }
  .stat .row { display: flex; justify-content: space-between; color: #bbb; }
  .stat .row b { color: #fff; font-size: 13px; font-weight: 600; }
  .stat .bar { position: relative; height: 4px; margin-top: 3px; background: #2e3236; border-radius: 2px; }
  .stat .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: #c9ccd0; border-radius: 2px; }
  .stat .bar u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--accent); }
  .kv { margin-top: 12px; display: grid; grid-template-columns: auto 1fr; gap: 3px 16px; font-size: 13px; }
  .kv dt { color: #999; } .kv dd { margin: 0; color: #eee; }
  .legend { margin-top: 6px; color: #777; font-size: 11.5px; }
  .legend u { display: inline-block; width: 2px; height: 10px; background: var(--accent); vertical-align: middle; margin: 0 4px; }
  /* 弾薬コスト表 */
  .cost h3 { margin: 18px 0 4px; font-size: 13px; color: var(--accent); font-weight: 600; }
  .cost .note { color: #777; font-size: 11.5px; margin-bottom: 6px; line-height: 1.6; }
  .cost .note input { width: 52px; font: inherit; color: #eee; background: #2a2d30; border: 1px solid #555; border-radius: 4px; padding: 1px 4px; }
  .cost .wrap { overflow-x: auto; }
  .cost table { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
  .cost th, .cost td { padding: 4px 6px; text-align: right; white-space: nowrap; border-bottom: 1px solid #2e3236; }
  .cost th { color: #999; font-weight: normal; font-size: 11px; }
  .cost th .r { display: block; color: #666; font-size: 10.5px; }
  .cost td:first-child, .cost th:first-child { text-align: left; }
  .cost td.mag, .cost th.mag { background: rgba(230,195,92,.07); color: #f1d98a; }
  .cost tr:hover td { background: #24272a; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .dot.灰 { background: #8a8d90; } .dot.紫 { background: #8e5cc9; } .dot.橙 { background: #d48a2c; }
  .lv { color: #888; font-size: 11px; margin-left: 4px; }

  /* 表示サイズのバー：画面の中央下に固定 */
  .size-control {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 20;
    padding: 10px 18px; background: rgba(20,22,24,.92); border: 1px solid #444; border-radius: 999px;
    font-size: 13px; color: #bbb; display: flex; align-items: center; gap: 12px; white-space: nowrap;
  }
  .size-control input { width: 260px; }
  #sizeValue { display: inline-block; min-width: 4.5em; text-align: right; }

  /* ---------- ページ切り替え（スコープ ⇄ 武器） ---------- */
  .site-nav {
    display: flex; justify-content: center; gap: 6px; margin: -16px 0 22px;
  }
  .site-nav a {
    color: #bbb; text-decoration: none; font-size: 14px; padding: 7px 18px;
    border: 1px solid #444; border-radius: 999px; background: #2a2d30;
  }
  .site-nav a:hover { border-color: #e6c35c; color: #fff; }
  .site-nav a.on { background: #e6c35c; border-color: #e6c35c; color: #111; font-weight: 600; }
  .site-nav a .sub, .site-nav a.on .sub { color: inherit; opacity: .7; font-size: .85em; }
</style>

      `<button data-k="${k}" class="${k === filter ? 'on' : ''}">${l}<span class="n">${n}</span></button>`).join('');

  function renderList() {
    const list = document.getElementById('list');
    const keys = filter === 'all' ? groups() : [filter];
    const act = activeSorts();
    const cell = (w, r) => {
      // 右上：優先度1の値（大きく）、優先度2・3の値（小さく）
      const vals = act.map((o, j) => {
        const v = valOf(w, o.k); const t = v === null ? '—' : v.toLocaleString();
        return j === 0 ? t : `<small>${t}</small>`;
      }).join('');
      return `<div class="cell"><img src="images/${w[1]}" data-i="${WEAPONS.indexOf(w)}" alt="${w[2]}" title="${w[2]}" loading="lazy">${

    if (!grouped && act.length) {
      // グループ分けなし：絞り込んだ範囲の中で通しの順位
      const ws = sorted(WEAPONS.filter(w => filter === 'all' || keyOf(w) === filter));
      const title = act.map(o => `${SORTS[o.k][0]}${o.desc ? '▼' : '▲'}`).join(' → ');
      list.innerHTML = `<div class="group-title">${title}（${ws.length}）</div>
        <div class="grid">${ws.map(cell).join('')}</div>`;
    } else {
      list.innerHTML = keys.map(k => {
        const ws = sorted(WEAPONS.filter(w => keyOf(w) === k));
        if (!ws.length) return '';
        return `<div class="group-title">${label(k)}（${ws.length}）</div>
          <div class="grid">${ws.map(cell).join('')}</div>`;
      }).join('');
    }
    list.querySelectorAll('.grid img').forEach(img => {
      img.classList.toggle('pinned', pinned === WEAPONS[img.dataset.i]);
      // カーソルが乗ったら一時的に表示
      img.addEventListener('mouseenter', () => show(WEAPONS[img.dataset.i]));
      // 離れたら、固定中の銃に戻す（固定していなければ消す）
      img.addEventListener('mouseleave', () => pinned ? show(pinned) : preview.classList.remove('show'));
      // クリックで固定（同じカードをもう一度クリックすると解除）
      img.addEventListener('click', e => {
        e.stopPropagation();
        const w = WEAPONS[img.dataset.i];

  function setPin(w) {

  document.addEventListener('keydown', e => { if (e.key === 'Escape') setPin(null); });
  function show(w) {
    document.getElementById('pvImg').src = 'images/' + w[1];
    const sameW = WEAPONS.filter(x => x[3] === w[3] && x !== w);
    const same = sameW.map(x => x[2]);
    document.getElementById('pvInfo').innerHTML =
      `<b>${w[2]}</b>${w === pinned ? '<span class="pin-badge">📌 固定中 / Pinned</span>' : ''}<br>
       <span class="tag">${TYPES[w[0]][0]} / ${TYPES[w[0]][1]}</span><span class="tag cal">${w[3]}</span>
       ${statsHtml(w)}
       ${costHtml(w)}
       <div class="same">同じ弾を使う銃 <span class="sub">/ Same caliber</span>：
         <span>${same.length ? same.join('、') : 'なし / None'}</span></div>
       <div class="same-grid">${sameW.map(x =>
         `<img src="images/${x[1]}" data-i="${WEAPONS.indexOf(x)}" alt="${x[2]}" title="${x[2]}（クリックで表示 / Click to show）">`).join('')}</div>
       <div class="hint">${w === pinned
         ? '背景クリック または Esc で解除 / Click the background or press Esc to unpin'
         : 'クリックで固定 / Click to pin'}</div>`;
    preview.classList.add('show');
    preview.classList.toggle('pinned', w === pinned);
    // 同じ弾の銃の写真をクリックすると、その銃に固定を切り替える
    // マガジン弾数を変えたら表を描き直す
    const mi = document.getElementById('magInput');
    if (mi) mi.addEventListener('change', () => {
      magSize = Math.max(1, Math.min(200, parseInt(mi.value) || 30));
      show(w);
    });
    preview.querySelectorAll('.same-grid img').forEach(img =>
      img.addEventListener('click', e => { e.stopPropagation(); setPin(WEAPONS[img.dataset.i]); }));
  }

  function render() { renderChips(); renderList(); }

  /* ---------- 並べ替え ---------- */
  // [日本語, 英語, STATSの何番目か]
  const SORTS = [
    ['リコイル制御（垂直）', 'Vertical recoil', 0], ['リコイル制御（水平）', 'Horizontal recoil', 1],
    ['エルゴノミクス', 'Ergonomics', 2], ['武器の安定性', 'Stability', 3], ['精度', 'Accuracy', 4],
    ['腰撃ち安定度', 'Hip-fire stability', 5], ['有効距離', 'Effective range', 6],
    ['銃口初速', 'Muzzle velocity', 7], ['連射速度（RPM）', 'Fire rate', 9],
  ];
  // 優先度1〜3（k = -1 は「なし」）
  const sortSpec = [{ k: -1, desc: true }, { k: -1, desc: true }, { k: -1, desc: true }];
  let grouped = true;

  // 使われている条件だけ（上から順に、「なし」が出たらそこで打ち切り）
  function activeSorts() {
    const out = [];
    for (const o of sortSpec) { if (o.k < 0) break; out.push(o); }
    return out;
  }
  const valOf = (w, k) => !STATS[w[1]] ? null : STATS[w[1]][SORTS[k][2]];
  function sorted(ws) {
    const act = activeSorts();
    if (!act.length) return ws;
    return [...ws].sort((a, b) => {
      for (const o of act) {
        const d = valOf(a, o.k) - valOf(b, o.k);
        if (d) return o.desc ? -d : d;      // 差があればそこで決まる。同じなら次の優先度へ
      }
      return WEAPONS.indexOf(a) - WEAPONS.indexOf(b);
    });
  }

  const dirLabel = d => d ? '▼ 高い順 <span class="sub">/ High→Low</span>' : '▲ 低い順 <span class="sub">/ Low→High</span>';
  function renderSortRows() {
    const box = document.getElementById('sortRows');
    const actN = activeSorts().length;
    box.innerHTML = sortSpec.map((o, i) => {
      const off = i > actN;   // 上の優先度が「なし」なら使えない
      const used = sortSpec.filter((x, j) => j !== i && j < actN).map(x => x.k);
      return `<div class="sortrow ${off ? 'off' : ''}">
        <span class="pri">優先度${i + 1}<br><span class="sub">Priority ${i + 1}</span></span>
        <select data-i="${i}" ${off ? 'disabled' : ''}>
          <option value="-1">${i === 0 ? '標準（番号順） / Default' : 'なし / None'}</option>
          ${SORTS.map((s, j) => used.includes(j) ? '' :
            `<option value="${j}" ${o.k === j ? 'selected' : ''}>${s[0]} / ${s[1]}</option>`).join('')}
        </select>
        <button data-i="${i}" ${off || o.k < 0 ? 'disabled' : ''}>${dirLabel(o.desc)}</button></div>`;
    }).join('');
    box.querySelectorAll('select').forEach(sel => sel.onchange = () => {
      const i = +sel.dataset.i;
      sortSpec[i].k = +sel.value;
      if (sortSpec[i].k < 0) for (let j = i + 1; j < 3; j++) sortSpec[j].k = -1;   // 下の優先度もクリア
      renderSortRows(); renderList();
    });
    box.querySelectorAll('button').forEach(btn => btn.onclick = () => {
      const o = sortSpec[+btn.dataset.i]; o.desc = !o.desc;
      renderSortRows(); renderList();
    });
  }
  renderSortRows();
  document.getElementById('sortReset').onclick = () => {
    sortSpec.forEach(o => { o.k = -1; o.desc = true; });
    renderSortRows(); renderList();
  };
  document.getElementById('groupChk').onchange = e => { grouped = e.target.checked; renderList(); };

  document.querySelectorAll('.modes button').forEach(b => b.onclick = () => {
    mode = b.dataset.mode; filter = 'all';
    document.querySelectorAll('.modes button').forEach(x => x.classList.toggle('on', x === b));
    render();
  });
  render();

  // 表示サイズのスライダー（CSSの --preview-width を書き換えるだけ）
  const slider = document.getElementById('sizeSlider');
  const sv     = document.getElementById('sizeValue');
  const start  = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--preview-width')) || 660;
  slider.value = start; sv.textContent = start + 'px';
  slider.addEventListener('input', () => {
    document.documentElement.style.setProperty('--preview-width', slider.value + 'px');
    sv.textContent = slider.value + 'px';
  });
</script>
</body>
</html>
