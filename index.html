<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>装備ビューア / Gear Viewer</title>
<style>
  body {
    margin: 0; min-height: 100vh; background: #1b1d1f; color: #ddd;
    font-family: "Segoe UI", "Yu Gothic UI", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 40px 16px; box-sizing: border-box;
  }
  h1 { font-size: 20px; font-weight: 600; letter-spacing: .05em; color: #ccc; margin: 0 0 28px; }
  .sub { color: #777; font-size: .8em; font-weight: normal; }
  .menu { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
  .menu a {
    width: 300px; text-decoration: none; color: #ddd; background: #232629;
    border: 1px solid #3a3e42; border-radius: 10px; padding: 18px; box-sizing: border-box;
    transition: border-color .15s, transform .15s;
  }
  .menu a:hover { border-color: #e6c35c; transform: translateY(-3px); }
  .menu .thumb { height: 120px; display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 14px; }
  .menu .thumb img { max-height: 100%; max-width: 100%; border-radius: 4px; }
  .menu b { display: block; font-size: 17px; color: #fff; }
  .menu p { margin: 6px 0 0; font-size: 13px; color: #999; line-height: 1.6; }
</style>
</head>
<body>
  <h1>装備ビューア <span class="sub">/ Gear Viewer</span></h1>
  <div class="menu">
    <a href="scopes/index.html">
      <div class="thumb">
        <img src="scopes/images/icons/14_Bat_Ear_Holo.png" alt="" style="height:90px">
        <img src="scopes/images/icons/09_4x.png" alt="" style="height:90px">
      </div>
      <b>スコープ <span class="sub">/ Scopes</span></b>
      <p>カーソルを合わせると覗いた画面を表示<br><span class="sub">Hover to see the view through each scope</span></p>
    </a>
    <a href="weapons/index.html">
      <div class="thumb"><img src="weapons/images/AR_01_AKM.png" alt=""></div>
      <b>武器 <span class="sub">/ Weapons</span></b>
      <p>種類別・弾丸別、ステータス、弾薬コスト<br><span class="sub">By type or caliber, stats and ammo cost</span></p>
    </a>
  </div>
</body>
</html>
